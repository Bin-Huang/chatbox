productName: Chatbox
appId: xyz.chatboxapp.app
asar: true
asarUnpack:
  - "**/*.{node,dll}"
  - "**/node_modules/libsql/**"
files:
  - "dist"
  # - "!dist/**/*.map"
  # - "!dist/**/stats.html"
  - "node_modules"
  - "!node_modules/@types"
  - "!node_modules/undici-types"
  - "package.json"

beforePack: .erb/scripts/ensure-app-deps.cjs
afterPack: .erb/scripts/after-pack.cjs
afterSign: .erb/scripts/notarize.js

# releaseInfo:
#   releaseNotes: See the changelog for details

mac:
  notarize: false
  category: public.app-category.developer-tools
  target:
    target: default
    arch:
      - arm64
      - x64
  type: distribution
  hardenedRuntime: true
  entitlements: assets/entitlements.mac.plist
  entitlementsInherit: assets/entitlements.mac.plist
  gatekeeperAssess: false

dmg:
  contents:
    - x: 130
      y: 220
    - x: 410
      y: 220
      type: link
      path: /Applications

win:
  target:
    - target: nsis
      arch:
        - x64
        - arm64
  verifyUpdateCodeSignature: false
  artifactName: ${productName}-${version}-Setup.${ext}
  signtoolOptions:
    sign: ./custom_win_sign.js
    signingHashAlgorithms:
      - sha256

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  include: assets/installer.nsh

linux:
  target:
    - target: AppImage
      arch:
        - x64
        - arm64
    - target: deb
      arch:
        - x64
        - arm64
  category: Development
  artifactName: ${productName}-${version}-${arch}.${ext}

directories:
  app: release/app
  buildResources: assets
  output: release/build

extraResources:
  - ./assets/**

# fork 独立更新源：发布到 ytterbium7/chatbox 的 GitHub Releases（latest.yml 等
# 更新元数据由 electron-builder 生成并上传）。与 src/main/app-updater.ts 中的
# FORK_UPDATE_FEED 保持一致。
publish:
  - provider: github
    owner: ytterbium7
    repo: chatbox
